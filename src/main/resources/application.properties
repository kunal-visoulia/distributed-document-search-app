server.port=8080
spring.application.name=doc-search-service

# OpenSearch
opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}
spring.elasticsearch.uris=http://${opensearch.host}:${opensearch.port}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000

# Cache TTL
cache.search-results.ttl=60
cache.document.ttl=300

# Rate Limiting
ratelimit.requests-per-second=100
ratelimit.burst-capacity=200

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.docsearch=DEBUG
logging.level.org.springframework.data.elasticsearch=WARN
