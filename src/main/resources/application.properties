server.port=8080
spring.application.name=doc-search-service

# OpenSearch
opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000

# Cache TTL (seconds)
cache.search-results.ttl=60
cache.document.ttl=300

# Rate Limiting (prototype: in-memory. Production: Kong + Redis)
ratelimit.requests-per-second=100
ratelimit.burst-capacity=200

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Exclude Spring Boot's default ES auto-config (we use OpenSearch client directly)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ReactiveElasticsearchClientAutoConfiguration

# Logging
logging.level.com.docsearch=INFO
logging.level.org.springframework.data.elasticsearch=WARN
logging.level.org.opensearch=WARN